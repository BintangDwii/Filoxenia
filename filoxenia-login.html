<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F4FAFC" />
  <meta name="description" content="Sign in to Filoxenia × Moana." />
  <title>Filoxenia × Moana — Login</title>
  <style>
    :root {
      --ocean-mist: #F4FAFC;
      --deep-blue: #1A3E5C;
      --turquoise: #D2F3F8;
      --coral: #E86A33;
      --muted-blue: #6F8BA3;
      --line: #D8E7EF;
      --sea: #5CBAD0;
      --sea-light: #A9E4EC;
      --sand: #FFF8EC;
      --white: #FFFFFF;
      --shadow: 0 28px 80px rgba(26, 62, 92, .12);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--deep-blue);
      background: var(--ocean-mist);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .login-shell {
      position: relative;
      width: min(1460px, 100%);
      min-height: min(860px, calc(100vh - 56px));
      display: grid;
      grid-template-columns: 1.04fr .96fr;
      overflow: hidden;
      border-radius: 30px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    /* LEFT SIDE — SUMMER ILLUSTRATION */
    .visual-panel {
      position: relative;
      min-height: 760px;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: var(--turquoise);
    }
    .visual-panel::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 48%, rgba(26,62,92,.035));
    }
    .sky-art {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
    }

    .brand-content {
      width: 100%;
      max-width: 650px;
      padding: 40px 28px;
      margin-top: -85px;
      text-align: center;
    }
    .brand-title {
      margin: 0;
      color: var(--deep-blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(54px, 5.6vw, 88px);
      font-weight: 700;
      letter-spacing: -4.5px;
      line-height: 1;
      white-space: nowrap;
    }
    .brand-title .flower-mark {
      display: inline-block;
      margin-left: 5px;
      color: var(--coral);
      font-family: sans-serif;
      font-size: .36em;
      vertical-align: top;
      transform: translateY(5px) rotate(12deg);
    }
    .brand-x-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: min(390px, 80%);
      margin: 12px auto 0;
    }
    .brand-x-row::before, .brand-x-row::after {
      content: "";
      height: 1.5px;
      flex: 1;
      background: var(--deep-blue);
      opacity: .56;
    }
    .brand-x {
      color: var(--coral);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(43px, 4.1vw, 65px);
      font-weight: 700;
      line-height: 1;
    }
    .brand-moana {
      margin: 2px 0 0;
      color: var(--deep-blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(55px, 5.2vw, 82px);
      font-weight: 700;
      letter-spacing: -3.5px;
      line-height: 1;
    }
    .brand-moana .wave-o {
      display: inline-block;
      position: relative;
      color: var(--deep-blue);
      font-size: .92em;
      text-shadow: 1px 1px 0 var(--sea);
    }

    /* RIGHT SIDE — LOGIN FORM */
    .form-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 76px clamp(42px, 6vw, 100px);
      background: var(--white);
    }
    .corner-flower {
      position: absolute;
      top: 42px;
      right: 44px;
      color: var(--coral);
      font-size: 42px;
      line-height: 1;
    }
    .form-content { width: 100%; max-width: 540px; }
    .form-heading {
      margin: 0 0 13px;
      color: var(--deep-blue);
      font-size: clamp(34px, 3.2vw, 48px);
      font-weight: 760;
      letter-spacing: -1.9px;
      line-height: 1.12;
    }
    .form-description {
      margin: 0 0 42px;
      color: var(--muted-blue);
      font-size: 16px;
      line-height: 1.65;
    }
    .field-group { margin-bottom: 18px; }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 62px;
      border: 1.5px solid var(--line);
      border-radius: 17px;
      background: var(--white);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .input-wrap:focus-within {
      border-color: var(--deep-blue);
      box-shadow: 0 0 0 4px rgba(26, 62, 92, .07);
    }
    .field-icon {
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      margin-left: 22px;
      color: var(--muted-blue);
    }
    .input-wrap input {
      width: 100%;
      min-width: 0;
      height: 60px;
      padding: 0 18px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--deep-blue);
      font-size: 16px;
    }
    .input-wrap input::placeholder { color: #8AA2B8; opacity: 1; }
    .password-toggle {
      display: grid;
      place-items: center;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      margin-right: 7px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted-blue);
    }
    .password-toggle:hover { background: var(--ocean-mist); }
    .password-toggle svg { width: 20px; height: 20px; }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 23px 0 28px;
      font-size: 14px;
    }
    .remember-option {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--deep-blue);
      cursor: pointer;
      user-select: none;
    }
    .remember-option input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--deep-blue);
      cursor: pointer;
    }
    a { color: var(--coral); text-decoration: none; transition: opacity .2s ease; }
    a:hover { opacity: .76; }

    .login-button {
      width: 100%;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      border: 0;
      border-radius: 17px;
      background: var(--deep-blue);
      color: var(--white);
      font-size: 17px;
      font-weight: 650;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .login-button:hover {
      transform: translateY(-2px);
      background: #244F70;
      box-shadow: 0 9px 22px rgba(26, 62, 92, .16);
    }
    .login-button:active { transform: translateY(0); }
    .login-button svg { width: 20px; height: 20px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 17px;
      margin: 34px 0 22px;
      color: var(--muted-blue);
      font-size: 14px;
      white-space: nowrap;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .social-buttons { display: flex; justify-content: center; gap: 16px; }
    .social-button {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 1.5px solid var(--line);
      border-radius: 50%;
      background: var(--ocean-mist);
      color: var(--deep-blue);
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .social-button:hover {
      transform: translateY(-2px);
      border-color: var(--deep-blue);
      background: #fff;
    }
    .social-button svg { width: 22px; height: 22px; }
    .signup-copy {
      margin: 28px 0 0;
      color: var(--muted-blue);
      text-align: center;
      font-size: 15px;
    }
    .signup-copy a { margin-left: 5px; font-weight: 650; }
    .form-message {
      display: none;
      margin: 18px 0 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--ocean-mist);
      color: var(--deep-blue);
      font-size: 13px;
      line-height: 1.5;
    }
    .form-message.is-visible { display: block; }

    @media (max-width: 1080px) {
      body { padding: 20px; }
      .login-shell { min-height: 720px; }
      .visual-panel { min-height: 720px; }
      .form-panel { padding-inline: 42px; }
      .brand-title { letter-spacing: -3px; }
    }
    @media (max-width: 760px) {
      body { display: block; padding: 14px; }
      .login-shell {
        width: 100%;
        min-height: auto;
        grid-template-columns: 1fr;
        border-radius: 24px;
      }
      .visual-panel { min-height: 390px; }
      .brand-content { margin-top: -35px; padding-inline: 15px; }
      .brand-title { font-size: clamp(50px, 12vw, 72px); letter-spacing: -3px; }
      .brand-x-row { width: min(320px, 76%); margin-top: 8px; }
      .brand-x { font-size: 48px; }
      .brand-moana { font-size: clamp(50px, 11vw, 68px); }
      .form-panel { padding: 64px 26px 42px; }
      .corner-flower { top: 19px; right: 25px; font-size: 31px; }
      .form-heading { font-size: 33px; }
      .form-description { margin-bottom: 29px; font-size: 14px; }
      .input-wrap { min-height: 58px; }
      .input-wrap input { height: 56px; font-size: 15px; }
      .form-options { font-size: 13px; }
    }
    @media (max-width: 380px) {
      .form-panel { padding-inline: 19px; }
      .form-options { gap: 8px; }
      .brand-title { font-size: 48px; }
      .brand-moana { font-size: 48px; }
      .brand-x { font-size: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="visual-panel" aria-label="Filoxenia and Moana tropical summer branding">
      <svg class="sky-art" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tropical island, palms, flowers and ocean">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D2F3F8" />
            <stop offset="1" stop-color="#B9EAF1" />
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#62C4D7" />
            <stop offset="1" stop-color="#8DDFE8" />
          </linearGradient>
        </defs>
        <rect width="800" height="900" fill="url(#sky)" />

        <!-- Sun and distant clouds -->
        <circle cx="176" cy="145" r="55" fill="#E86A33" />
        <path d="M-35 285c-1-35 27-63 63-63 22 0 42 12 53 30 11-9 25-14 40-14 34 0 62 27 63 61H-35Z" fill="#F4FAFC" opacity=".88" />
        <path d="M625 237c12-34 44-58 83-58 19 0 37 6 51 18 14-30 44-50 79-50 50 0 90 40 90 90v29H625Z" fill="#A9E4EC" opacity=".9" />
        <path d="M680 480c11-28 39-48 71-48 29 0 54 16 66 40" fill="none" stroke="#F4FAFC" stroke-width="17" stroke-linecap="round" opacity=".8" />

        <!-- Seabirds -->
        <path d="M392 155q33-31 67 0q34-49 73-25q-36-4-68 41q-33-29-72-16Z" fill="#1A3E5C" />
        <path d="M292 205q25-21 50 0q25-31 51-15q-24-2-50 29q-24-21-51-14Z" fill="#1A3E5C" />

        <!-- Distant tropical island -->
        <path d="M0 690q81-53 159-24 56-62 117-39 55-64 109-12 72-64 132-8 77-49 154 5 72-27 129 12v120H0Z" fill="#438EAD" />
        <path d="M0 740q105-36 199 2 82-30 156 2 76-24 153 7 91-30 169 1 61-16 123 5v143H0Z" fill="#5CBAD0" />

        <!-- Sea and shoreline -->
        <path d="M0 748q128-17 228 11 98 27 188 7 110-24 188 3 96 31 196 5v126H0Z" fill="url(#water)" />
        <path d="M0 756q104-14 196 18 92 32 168 26 82-7 145 20 93 38 163 34 72-4 128 23v23H0Z" fill="#FFF8EC" />
        <path d="M0 750q122-10 202 17 98 34 187 23 92-12 169 19 115 46 242 25" fill="none" stroke="#F4FAFC" stroke-width="10" opacity=".9" />
        <path d="M180 788q94-21 168 5 74 26 150 5 88-24 165 8" fill="none" stroke="#BCEEF2" stroke-width="14" stroke-linecap="round" />
        <path d="M270 834q89-14 154 9 67 23 136 6 64-16 122 7" fill="none" stroke="#D2F3F8" stroke-width="10" stroke-linecap="round" />

        <!-- Distant sailboat -->
        <path d="M704 706v-45l25 45Z" fill="#F4FAFC" />
        <path d="M700 708h37q-18 13-37 0Z" fill="#1A3E5C" />
        <path d="M703 660v52" stroke="#1A3E5C" stroke-width="2" />

        <!-- Palm tree: trunk and fronds -->
        <path d="M45 820q40-123 104-228" fill="none" stroke="#1A3E5C" stroke-width="15" stroke-linecap="round" />
        <path d="M148 596q-57-55-111-21 53 2 87 43-64-27-97 13 65-15 107 12-39-1-66 35 59-32 95-60 33 35 82 31-39-27-68-53 50 4 80-34-57 23-97 18 43-34 44-73-33 44-61 62 4-53-23-70 15 51 2 95-11-29-49-41 27 30 35 58Z" fill="#1A3E5C" />
        <path d="M117 862q23-75 52-111" fill="none" stroke="#1A3E5C" stroke-width="9" stroke-linecap="round" />
        <path d="M168 752q-38-32-68-13 36 3 57 28-43-15-64 14 42-14 70 0-24 9-34 31 38-24 54-41 22 22 54 16-27-15-46-32 33 0 51-26-37 14-65 10 28-24 23-52-16 31-37 47 0-33-19-44 10 31 4 62-7-20-32-22 18 18 18 35Z" fill="#1A3E5C" />

        <!-- Foreground tropical foliage -->
        <path d="M0 872q49-82 120-48 43 21 67 76H0Z" fill="#1A3E5C" />
        <path d="M115 900q39-73 111-57 41 9 67 57Z" fill="#1A3E5C" />
        <path d="M240 900q31-46 76-39 32 5 51 39Z" fill="#1A3E5C" />

        <!-- Hibiscus flower -->
        <g transform="translate(132 835)" fill="#E86A33">
          <ellipse cx="0" cy="-28" rx="18" ry="31" />
          <ellipse cx="27" cy="-8" rx="18" ry="31" transform="rotate(72 27 -8)" />
          <ellipse cx="17" cy="24" rx="18" ry="31" transform="rotate(144 17 24)" />
          <ellipse cx="-17" cy="24" rx="18" ry="31" transform="rotate(216 -17 24)" />
          <ellipse cx="-27" cy="-8" rx="18" ry="31" transform="rotate(288 -27 -8)" />
          <circle r="7" fill="#FFF8EC" />
          <path d="M5-2q24-18 38-34" fill="none" stroke="#FFF8EC" stroke-width="3.5" stroke-linecap="round" />
          <circle cx="45" cy="-38" r="3" fill="#FFF8EC" />
        </g>
      </svg>

      <div class="brand-content">
        <h1 class="brand-title">Filoxenia<span class="flower-mark" aria-hidden="true">✿</span></h1>
        <div class="brand-x-row" aria-label="times">
          <span class="brand-x">X</span>
        </div>
        <p class="brand-moana">M<span class="wave-o">◎</span>ana</p>
      </div>
    </section>

    <section class="form-panel" aria-labelledby="login-title">
      <span class="corner-flower" aria-hidden="true">✿</span>
      <div class="form-content">
        <h2 class="form-heading" id="login-title">Welcome Back!</h2>
        <p class="form-description">Sign in to continue your journey with Filoxenia × Moana.</p>

        <form id="login-form">
          <div class="field-group">
            <label class="input-wrap" for="email">
              <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.7 0-8.5 2.4-8.5 5.4V22h17v-2.6c0-3-3.8-5.4-8.5-5.4Z" />
              </svg>
              <input id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required />
            </label>
          </div>

          <div class="field-group">
            <div class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2ZM10 6a2 2 0 1 1 4 0v2h-4V6Zm2 11.7a2 2 0 1 1 1-3.7 2 2 0 0 1-1 3.7Z" />
              </svg>
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required minlength="6" />
              <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path d="m3 3 18 18" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-option" for="remember">
              <input id="remember" name="remember" type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#forgot-password" id="forgot-link">Forgot password?</a>
          </div>

          <button class="login-button" type="submit">
            <span>Login</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 5l7 7-7 7" />
            </svg>
          </button>

          <div class="divider"><span>or continue with</span></div>

          <div class="social-buttons" aria-label="Other sign in options">
            <button class="social-button" type="button" aria-label="Continue with Google" title="Continue with Google">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M21.6 12.23c0-.72-.06-1.41-.18-2.08H12v3.94h5.38a4.6 4.6 0 0 1-2 3.02v2.47h3.23c1.89-1.74 2.99-4.3 2.99-7.35Z" />
                <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.42l-3.23-2.47c-.9.6-2.04.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.55A10 10 0 0 0 12 22Z" />
                <path fill="#FBBC05" d="M6.39 13.94a6 6 0 0 1 0-3.88V7.51H3.05a10 10 0 0 0 0 8.98l3.34-2.55Z" />
                <path fill="#EA4335" d="M12 5.93c1.47 0 2.79.51 3.83 1.52l2.87-2.87C16.96 2.97 14.7 2 12 2a10 10 0 0 0-8.95 5.51l3.34 2.55C7.18 7.69 9.39 5.93 12 5.93Z" />
              </svg>
            </button>
            <button class="social-button" type="button" aria-label="Continue with GitHub" title="Continue with GitHub">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.03.75 2.08V22c0 .29.2.63.76.53A11.1 11.1 0 0 0 12 .9Z" />
              </svg>
            </button>
          </div>

          <p class="signup-copy">Don’t have an account? <a href="#signup" id="signup-link">Sign up</a></p>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    const eyeIcon = document.getElementById("eye-icon");
    const loginForm = document.getElementById("login-form");
    const formMessage = document.getElementById("form-message");

    function showMessage(message) {
      formMessage.textContent = message;
      formMessage.classList.add("is-visible");
    }

    // Show or hide the password field.
    togglePassword.addEventListener("click", () => {
      const shouldShow = passwordInput.type === "password";
      passwordInput.type = shouldShow ? "text" : "password";
      togglePassword.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
      togglePassword.setAttribute("aria-pressed", String(shouldShow));
      eyeIcon.innerHTML = shouldShow
        ? '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 3 18 18"/>';
    });

    // Frontend demo only: connect this handler to your authentication API.
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!loginForm.reportValidity()) return;
      showMessage("Your login form is ready. Connect it to your backend authentication endpoint to sign in.");
    });

    document.getElementById("forgot-link").addEventListener("click", (event) => {
      event.preventDefault();
      showMessage("Connect this link to your password recovery page.");
    });

    document.getElementById("signup-link").addEventListener("click", (event) => {
      event.preventDefault();
      showMessage("Connect this link to your account registration page.");
    });

    document.querySelectorAll(".social-button").forEach((button) => {
      button.addEventListener("click", () => {
        showMessage("Social sign-in is a frontend placeholder. Configure Google or GitHub OAuth to enable it.");
      });
    });
  </script>
</body>
</html>
